<footer class="site-footer">
  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <p class="copyright">
          &copy; {{ site.time | date: '%Y' }}
          <a href="https://github.com/dlunch" target="_blank" rel="noopener noreferrer">dlunch</a>
          <span class="footer-separator">|</span>
          <a
            href="#"
            class="footer-email"
            aria-label="{{ site.data.translations.en.footer_email }}"
            data-i18n-aria-label="footer_email"
            onclick="this.href='mai'+'lto:'+'wie'+'@'+'dlun'+'.ch';return true;"
          ><i class="fas fa-envelope" aria-hidden="true"></i></a>
        </p>
      </div>
    </div>

    <hr class="footer-divider" />

    <div class="footer-disclaimer">
      <p data-i18n-html="footer_legal">{{ site.data.translations.en.footer_legal }}</p>
      <p class="warning-text" data-i18n-html="footer_warning">{{ site.data.translations.en.footer_warning }}</p>
    </div>
  </div>
</footer>
