<header class="site-header">
  <div class="inner">
    <h1 class="brand"><a href="/">WIE</a></h1>
    <nav class="main-nav">
      <a href="/" data-i18n="nav_home">{{ site.data.translations.ko.nav_home }}</a>
      <a href="/compatibility.html" data-i18n="compatibility_title">{{ site.data.translations.ko.compatibility_title }}</a>
      <a href="/faq.html">FAQ</a>
      <a
        href="https://github.com/dlunch/wie"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-github"
        aria-label="GitHub"
      >
        <i class="fab fa-github" aria-hidden="true"></i><span> GitHub</span>
      </a>
      <a
        href="https://github.com/dlunch/wie/issues/new"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-bug-report"
        aria-label="{{ site.data.translations.ko.nav_bug }}"
        data-i18n-aria-label="nav_bug"
      >
        <i class="fas fa-bug" aria-hidden="true"></i><span data-i18n="nav_bug">{{ site.data.translations.ko.nav_bug }}</span>
      </a>
      <a
        href="https://github.com/sponsors/dlunch"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-sponsor"
        aria-label="{{ site.data.translations.ko.nav_sponsor }}"
        data-i18n-aria-label="nav_sponsor"
      >
        <i class="fas fa-heart" aria-hidden="true"></i><span data-i18n="nav_sponsor">{{ site.data.translations.ko.nav_sponsor }}</span>
      </a>
    </nav>
    <div class="language-setting" hidden>
      <label for="language-select" aria-hidden="true">🌐</label>
      <select
        id="language-select"
        aria-label="{{ site.data.translations.ko.language_label }}"
        data-i18n-aria-label="language_label"
      >
        <option value="ko" lang="ko">한국어</option>
        <option value="en" lang="en">English</option>
      </select>
    </div>
  </div>
</header>
