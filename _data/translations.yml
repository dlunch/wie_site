  faq_heading: "자주 묻는 질문"
  faq_intro: "WIE에 대해 궁금한 점을 확인해보세요"
  faq_what_question: "WIE는 무엇인가요?"
  faq_what_answer: "WIE는 2000년대 피처폰 시절의 모바일 게임(WIPI, SKVM, J2ME)을 PC와 모바일 웹 브라우저에서 실행할 수 있게 해주는 오픈소스 에뮬레이터입니다. 별도의 설치 없이 웹 브라우저만 있으면 추억의 게임을 즐길 수 있습니다."
  faq_games_question: "어떤 게임을 실행할 수 있나요?"
  faq_games_answer: "WIPI(Wireless Internet Platform for Interoperability), SKVM(SK Virtual Machine), J2ME(Java 2 Micro Edition) 플랫폼으로 개발된 게임과 앱을 실행할 수 있습니다. 지원 현황 페이지에서 호환되는 게임 목록을 확인해보세요."
  faq_files_question: "실행할 때 어떤 파일을 넣어야 하나요?"
  faq_files_answer: "피쳐폰에서 추출한 파일들을 모두 압축한 .zip을 넣어 주셔야 합니다. .zip 안에 .jar 등의 파일이 있으면 됩니다."
  faq_source_question: "게임 파일은 어디서 구할 수 있나요?"
  faq_source_answer: "WIE는 에뮬레이터만 제공하며, 게임 파일(ROM)은 직접 구해야 합니다. 과거에 구매했던 게임의 백업 파일을 사용하시거나, 합법적으로 배포되는 게임을 이용해주세요."
  faq_mobile_question: "모바일에서도 사용할 수 있나요?"
  faq_mobile_answer: "네, WIE는 모바일 웹 브라우저에서도 작동합니다. 스마트폰이나 태블릿의 웹 브라우저로 접속하면 터치 컨트롤을 통해 게임을 플레이할 수 있습니다."
  faq_saves_question: "게임 저장은 어떻게 하나요?"
  faq_saves_answer: "게임 진행 상황은 브라우저의 로컬 스토리지에 자동으로 저장됩니다. 같은 브라우저로 다시 접속하면 이전 진행 상황을 이어서 플레이할 수 있습니다. 단, 브라우저 데이터를 삭제하면 저장 데이터도 함께 삭제되니 주의하세요."
  faq_bugs_question: "특정 게임이 실행되지 않아요. 어떻게 해야 하나요?"
  faq_bugs_answer: "WIE는 아직 개발 중인 프로젝트로, 모든 게임이 완벽하게 호환되지는 않습니다. 실행되지 않는 게임이 있다면 GitHub 이슈를 통해 버그를 제보해주세요. 개발팀이 확인 후 호환성을 개선하겠습니다."
