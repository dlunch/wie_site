  faq_heading: "Frequently asked questions"
  faq_intro: "Find answers to your questions about WIE"
  faq_what_question: "What is WIE?"
  faq_what_answer: "WIE is an open-source emulator that runs mobile games from the feature phone era of the 2000s (WIPI, SKVM, and J2ME) in desktop and mobile web browsers. Enjoy classic games with just a web browser, without installing anything."
  faq_games_question: "Which games can I run?"
  faq_games_answer: "You can run games and apps developed for WIPI (Wireless Internet Platform for Interoperability), SKVM (SK Virtual Machine), and J2ME (Java 2 Micro Edition). See the Compatibility page for a list of compatible games."
  faq_files_question: "Which files should I load?"
  faq_files_answer: "Provide a .zip archive containing all the files extracted from your feature phone. The archive should contain files such as .jar files."
  faq_source_question: "Where can I get game files?"
  faq_source_answer: "WIE only provides the emulator. You need to obtain game files (ROMs) yourself. Use backups of games you previously purchased or games distributed legally."
  faq_mobile_question: "Can I use WIE on mobile?"
  faq_mobile_answer: "Yes, WIE works in mobile web browsers. Open it in a browser on your smartphone or tablet to play using touch controls."
  faq_saves_question: "How do I save my game?"
  faq_saves_answer: "Game progress is automatically saved in your browser’s local storage. Return using the same browser to pick up where you left off. Be aware that clearing browser data also deletes your saved progress."
  faq_bugs_question: "A game will not run. What should I do?"
  faq_bugs_answer: "WIE is still in development, and not all games are fully compatible. If a game will not run, please report it through GitHub Issues. The development team will investigate and work to improve compatibility."
